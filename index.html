<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Ką nuveikti šiandien? | Vilniaus maži nuotykiai 2-3 m. vaikams</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg-color: #F7F5EC;
            --graphite: #3F3E3C;

            /* Prigesintos, natūralios spalvos */
            --col-hiking: #3E6B89;
            --col-activity: #C76B5C;
            --col-food: #4A7C59;
            --col-lakes: #A3B5D6;
            --col-museum: #B85D38;
            --col-other: #2C4C64;
            --col-playground: #D1A153;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--graphite);
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--graphite);
        }
        @media (min-width: 768px) {
            header h1 {
                font-size: 2.8rem;
            }
        }
        header p {
            margin: 12px 0 0 0;
            font-size: 1rem;
            color: var(--graphite);
            font-weight: 500;
        }
        @media (min-width: 768px) {
            header p {
                font-size: 1.15rem;
            }
        }

        /* Filtravimo sekcija */
        #filtersGrid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            #filtersGrid {
                grid-template-columns: 1fr 1fr;
                gap: 0;
            }
        }

        .filter-group {
            border: 2px solid var(--graphite);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 4px 4px 0px 0px var(--graphite);
        }

        .filter-group.primary {
            border-width: 3px;
            box-shadow: 6px 6px 0px 0px var(--graphite);
        }
        
        .filter-group.energy-filter {
            margin-bottom: 0;
        }

        .category-place-container .filter-group {
            margin-bottom: 0;
        }
        
        .filter-group.energy-filter,
        .filter-group.vibe-filter {
            text-align: left;
        }

        .filter-group.energy-filter .filter-options,
        .filter-group.vibe-filter .filter-options {
            justify-content: flex-start;
        }

        .filter-group.energy-filter,
        .filter-group.vibe-filter,
        .filter-group.category-place-container,
        .filter-group.category-filter,
        .filter-group.place-filter {
            border: none;
            box-shadow: none;
            padding-left: 0;
            padding-right: 0;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        @media (min-width: 768px) {
            .filter-group.category-place-container {
                grid-column: 1 / -1;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
            }
            .category-place-container .place-filter {
                text-align: left;
            }
            .category-place-container .place-filter .filter-options {
                justify-content: flex-start;
            }
        }

        .filter-group h2 {
            font-size: 0.85rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            color: var(--graphite);
            /* text-transform: uppercase; */
            letter-spacing: 0.03em;
            text-align: left;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-start;
        }

        /* Kompaktiški mygtukai */
        .btn-opt {
            border: 2px solid var(--graphite);
            color: var(--graphite);
            padding: 6px 12px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-opt:hover {
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0px 0px var(--graphite);
        }

        .btn-opt.active {
            background-color: var(--graphite);
            color: #FFFFFF;
        }

        /* Specifinis stilius vibe filtrams (Ko šiandien norisi?) */
        .vibe-filter .filter-options {
            display: block;
            width: 100%;
        }

        .category-menu-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .category-menu-item {
            --link-background-color: #cbe1ed;
            --link-text-color: #00559b;
            --link-shadow-color: #1a365d;
            position: relative;
        }

        .energy-filter .category-menu-item {
            --link-background-color: #fce7b2;
            --link-text-color: #8c6d1f;
            --link-shadow-color: #5e4a15;
        }

        .category-menu-link {
            position: relative;
            display: inline-block;
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .category-menu-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: var(--link-background-color);
            padding: 10px 20px;
            border-radius: 50px;
        }

        .category-menu-text {
            color: var(--link-text-color);
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .category-menu-link-shadow {
            position: absolute;
            top: 4px;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--link-shadow-color);
            border-radius: 50px;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .category-menu-link:hover {
            transform: translateY(-2px);
        }

        .category-menu-link.active .category-menu-content {
            background-color: var(--link-text-color);
        }
        
        .category-menu-link.active .category-menu-text {
            color: #FFFFFF;
        }

        .category-menu-link.active .category-menu-link-shadow {
            opacity: 1;
        }

        .category-menu-link.active {
            transform: translateY(-2px);
        }


        /* Segmentuotas perjungiklis (Kur norisi būti?) */
        .segmented-toggle {
            display: inline-flex;
            border: 2px solid var(--graphite);
            border-radius: 50px;
            overflow: hidden;
        }

        .seg-opt {
            color: var(--graphite);
            border: none;
            padding: 6px 15px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .seg-opt + .seg-opt {
            border-left: 2px solid var(--graphite);
        }

        .seg-opt.active {
            background-color: var(--graphite);
            color: #FFFFFF;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            gap: 20px;
        }
        @media (min-width: 768px) {
            .grid-container {
                gap: 30px;
            }
        }
        .card {
            color: #FFFFFF;
            border-radius: 28px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 6px 6px 0px 0px var(--graphite);
            border: 3px solid var(--graphite);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        @media (min-width: 768px) {
            .card {
                padding: 32px 28px;
            }
        }

        /* Kategorijų spalvos */
        .card[data-category="hiking"] { background-color: var(--col-hiking); }
        .card[data-category="museum"] { background-color: var(--col-museum); }
        .card[data-category="playground"] { background-color: var(--col-playground); color: #2B2D42; }
        .card[data-category="activity"] { background-color: var(--col-activity); }
        .card[data-category="food"] { background-color: var(--col-food); }
        .card[data-category="lakes"] { background-color: var(--col-lakes); color: #2B2D42; }
        .card[data-category="lakes"] a { color: #1a365d; }
        .card[data-category="other"] { background-color: var(--col-other); }

        /* Tamsesnių kortelių stiliai */
        .card[data-category="playground"] .card-footer,
        .card[data-category="lakes"] .card-footer {
            border-top: 2px solid rgba(0, 0, 0, 0.15);
        }
        .card[data-category="playground"] .btn,
        .card[data-category="lakes"] .btn {
            color: #2B2D42;
        }
        .card[data-category="playground"] .kids-info,
        .card[data-category="lakes"] .kids-info {
            background: rgba(0, 0, 0, 0.06);
        }

        /* Kortelės lygio piktograma footeryje */
        .card-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .energy-icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            color: currentColor;
            opacity: 0.9;
        }
        .card[data-category="playground"] .energy-icon-badge,
        .card[data-category="lakes"] .energy-icon-badge {
            color: #2B2D42;
        }
        .flat-svg-icon {
            width: 20px;
            height: 20px;
        }
        .energy-icon-badge svg {
            width: 20px;
            height: 20px;
        }
        .chip-icon {
            display: inline-flex;
            align-items: center;
            width: 14px;
            height: 14px;
        }
        .chip-icon svg,
        .place-icon svg {
            width: 100%;
            height: 100%;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 4px;
        }

        .card h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        @media (min-width: 768px) {
            .card h3 {
                font-size: 1.35rem;
            }
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .details-line {
            font-size: 0.85rem;
            line-height: 1.4;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .place-icon {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .kids-info {
            font-size: 0.85rem;
            line-height: 1.35;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 12px;
            border-radius: 12px;
            margin-top: 4px;
        }
        .task-box {
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.1);
            padding: 8px 10px;
            border-radius: 8px;
            margin-top: 2px;
        }

        .btn {
            display: inline-block;
            color: inherit;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 800;
            transition: opacity 0.2s ease;
        }
        .btn:hover {
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ką nuveikti ŠIANDIEN?</h1>
        <p>Maži nuotykiai po darželio (2–3 m. vaikams)</p>
    </header>

    <!-- Filtrai generuojami iš filters.json -->
    <div id="filtersGrid"></div>

    <div class="grid-container" id="gridContainer"></div>

    <script>
        // Pakartotinai naudojamos SVG piktogramos
        const ICONS = {
            sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
            cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>',
            rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="13" x2="16" y2="21"></line><line x1="8" y1="13" x2="8" y2="21"></line><line x1="12" y1="15" x2="12" y2="23"></line><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></svg>',
            circle:        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="9"/></svg>',
            'half-circle': '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0 0 20V2z"/></svg>',
            'full-circle': '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>',
            home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>',
            tree: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><line x1="12" y1="15" x2="12" y2="22"></line></svg>'
        };

        const FILTER_ORDER = ['energy', 'vibe', 'category', 'place'];

        function icon(name) {
            return ICONS[name] || '';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function renderCard(item) {
            const f = item.filters || {};
            const info = item.info || {};
            const vibes = Array.isArray(f.vibe) ? f.vibe : (f.vibe ? [f.vibe] : []);
            const places = Array.isArray(f.place) ? f.place : (f.place ? [f.place] : []);
            const energyOpt = (optionsByType.energy && optionsByType.energy[f.energy]) || {};
            const placesHtml = places
                .map(id => (optionsByType.place && optionsByType.place[id]) || null)
                .filter(Boolean)
                .map(o => `<span class="place-icon">${icon(o.icon)}</span> ${escapeHtml(o.title)}`)
                .join(' · ');

            return `
        <div class="card" data-category="${escapeHtml(item.category)}" data-energy="${escapeHtml(f.energy)}" data-vibe="${escapeHtml(vibes.join(' '))}" data-place="${escapeHtml(places.join(' '))}">
            <div class="card-content">
                <div class="card-header-row">
                    <h3>${escapeHtml(item.title)}</h3>
                </div>
                <div class="details-line">⏱️ ${escapeHtml(item.duration)} | ${placesHtml}</div>
                <div class="kids-info">
                    <strong>Ką veikiam:</strong> ${escapeHtml(item.activity)}<br>
                    <strong>Pasiimti:</strong> ${escapeHtml(info.bring)}<br>
                    <strong>2–3 m.:</strong> ${escapeHtml(info.ageNote)}
                </div>
                <div class="task-box"><strong>Užduotis:</strong> ${escapeHtml(info.task)}</div>
            </div>
            <div class="card-footer">
                <span class="energy-icon-badge" title="${escapeHtml(energyOpt.title || '')}">
                    ${icon(energyOpt.icon)}
                </span>
                <a href="${escapeHtml(item.url)}" target="_blank" class="btn">Atidaryti žemėlapyje →</a>
            </div>
        </div>`;
        }

        const gridContainer = document.getElementById('gridContainer');
        const filtersGrid = document.getElementById('filtersGrid');

        let cards = [];
        let optionsByType = {};
        let active = {};   // { energy: 'all', vibe: 'all', category: 'all', place: ['indoor','outdoor'], ... }

        // Pradinės filtrų reikšmės: segmentuoti (multi) – visi pažymėti; kiti – 'all'
        function initActive(filters) {
            const a = {};
            Object.keys(filters).forEach(type => {
                a[type] = filters[type].control === 'segmented'
                    ? filters[type].options.map(o => o.id)
                    : 'all';
            });
            return a;
        }

        // filters[type].options -> { id: option } paieškai kortelėse
        function indexOptions(filters) {
            const byType = {};
            Object.keys(filters).forEach(type => {
                byType[type] = {};
                filters[type].options.forEach(opt => { byType[type][opt.id] = opt; });
            });
            return byType;
        }

        function buildFilters(filters) {
            const types = FILTER_ORDER.filter(type => filters[type]);
            
            // Sugrupuojam category ir place jei jie yra
            const hasCategory = types.includes('category');
            const hasPlace = types.includes('place');

            let html = '';
            
            const renderGroup = (type) => {
                const def = filters[type];
                let controlHtml;
                let groupClass = 'filter-group';
                if (type === 'energy') groupClass += ' energy-filter';
                if (type === 'vibe') groupClass += ' vibe-filter';
                if (type === 'category') groupClass += ' category-filter';
                if (type === 'place') groupClass += ' place-filter';
                let optionsClass = 'filter-options';

                if (def.control === 'segmented') {
                    const segs = def.options.map(opt => {
                        const activeCls = active[type].includes(opt.id) ? ' active' : '';
                        const iconHtml = opt.icon ? `<span class="chip-icon">${icon(opt.icon)}</span>` : '';
                        return `<button class="seg-opt${activeCls}" data-type="${type}" data-value="${escapeHtml(opt.id)}" data-multi="1">${iconHtml}${escapeHtml(opt.title)}</button>`;
                    }).join('');
                    controlHtml = `<div class="segmented-toggle">${segs}</div>`;
                } else if (type === 'vibe' || type === 'energy') {
                    const options = def.options.some(o => o.id === 'all')
                            ? def.options
                            : [{ id: 'all', title: 'Visi' }].concat(def.options);
                    
                    const items = options.map(opt => {
                        const activeCls = opt.id === active[type] ? ' active' : '';
                        const iconHtml = opt.icon ? `<span class="chip-icon">${icon(opt.icon)}</span> ` : '';
                        return `
                            <li class="category-menu-item">
                                <a href="#" class="category-menu-link${activeCls}" data-type="${type}" data-value="${escapeHtml(opt.id)}" onclick="return false;">
                                    <span class="category-menu-content">
                                        <span class="category-menu-text">${iconHtml}${escapeHtml(opt.title)}</span>
                                    </span>
                                    <span class="category-menu-link-shadow"></span>
                                </a>
                            </li>`;
                    }).join('');
                    controlHtml = `<ul class="category-menu-list">${items}</ul>`;
                } else {
                    const options = (type === 'place')
                        ? def.options
                        : (def.options.some(o => o.id === 'all')
                            ? def.options
                            : [{ id: 'all', title: 'Visi' }].concat(def.options));

                    controlHtml = options.map(opt => {
                        const activeCls = opt.id === active[type] ? ' active' : '';
                        const iconHtml = opt.icon ? `<span class="chip-icon">${icon(opt.icon)}</span>` : '';
                        const titleAttr = opt.description ? ` title="${escapeHtml(opt.description)}"` : '';
                        return `<button class="btn-opt${activeCls}" data-type="${type}" data-value="${escapeHtml(opt.id)}"${titleAttr}>${iconHtml}${escapeHtml(opt.title)}</button>`;
                    }).join('');
                }

                return `
        <div class="${groupClass}">
            <h2>${escapeHtml(def.label)}</h2>
            <div class="${optionsClass}">${controlHtml}</div>
        </div>`;
            };

            const processedTypes = new Set();
            
            types.forEach(type => {
                if (processedTypes.has(type)) return;
                
                if ((type === 'category' || type === 'place') && hasCategory && hasPlace) {
                    if (processedTypes.has('category') || processedTypes.has('place')) return;
                    html += `<div class="filter-group category-place-container">
                        ${renderGroup('category')}
                        ${renderGroup('place')}
                    </div>`;
                    processedTypes.add('category');
                    processedTypes.add('place');
                } else {
                    html += renderGroup(type);
                    processedTypes.add(type);
                }
            });

            filtersGrid.innerHTML = html;

            filtersGrid.querySelectorAll('button[data-type], a[data-type]').forEach(button => {
                button.addEventListener('click', (e) => {
                    const type = button.getAttribute('data-type');
                    if (button.getAttribute('data-multi')) {
                        button.classList.toggle('active');
                        const value = button.getAttribute('data-value');
                        const arr = active[type];
                        const i = arr.indexOf(value);
                        if (i === -1) arr.push(value); else arr.splice(i, 1);
                    } else {
                        filtersGrid.querySelectorAll('[data-type="' + type + '"]').forEach(b => b.classList.remove('active'));
                        button.classList.add('active');
                        active[type] = button.getAttribute('data-value');
                    }
                    filterCards();
                });
            });
        }

        function filterCards() {
            cards.forEach(card => {
                const cardVibes = (card.getAttribute('data-vibe') || '').split(' ').filter(Boolean);
                const cardPlaces = (card.getAttribute('data-place') || '').split(' ').filter(Boolean);
                const placeSel = active.place || [];
                // multi-select: kortelė tinka, jei bent viena jos vieta pažymėta (arba nepažymėta nė viena)
                const matchesPlace = placeSel.length === 0 || cardPlaces.some(p => placeSel.includes(p));
                const ok =
                    (active.energy === 'all'   || card.getAttribute('data-energy')   === active.energy) &&
                    matchesPlace &&
                    (active.category === 'all' || card.getAttribute('data-category') === active.category) &&
                    (active.vibe === 'all'     || cardVibes.includes(active.vibe));
                card.style.display = ok ? 'flex' : 'none';
            });
        }

        Promise.all([
            fetch('filters.json', { cache: 'no-store' }).then(r => r.json()),
            fetch('activities.json', { cache: 'no-store' }).then(r => r.json())
        ])
            .then(([filters, activities]) => {
                optionsByType = indexOptions(filters);
                active = initActive(filters);
                buildFilters(filters);
                gridContainer.innerHTML = activities.map(renderCard).join('');
                cards = document.querySelectorAll('.card');
                filterCards();
            })
            .catch(err => {
                gridContainer.innerHTML = '<p>Nepavyko įkelti veiklų. Patikrink, ar puslapis atidarytas per serverį (ne per file://).</p>';
                console.error('Nepavyko įkelti duomenų:', err);
            });
    </script>

</body>
</html>
